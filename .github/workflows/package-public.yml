name: package-public
on:
  workflow_dispatch:
permissions:
  packages: write
  contents: read
jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - name: Make GHCR container package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH /orgs/ucm-system/packages/container/ucm-accept \
            -f visibility=public
          gh api /orgs/ucm-system/packages/container/ucm-accept \
            --jq '{name,visibility,html_url}'
