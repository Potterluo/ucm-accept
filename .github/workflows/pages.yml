name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preview:
    name: capture GUI preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install playwright
          playwright install chromium --with-deps
      - name: Resolve latest release URL
        id: release
        run: |
          URL=$(gh api repos/${{ github.repository }}/releases/latest --jq '.html_url' 2>/dev/null || true)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Capture GUI screenshots
        run: python scripts/capture_gui.py --out site --release-url "${{ steps.release.outputs.url }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
