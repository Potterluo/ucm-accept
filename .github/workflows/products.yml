name: build-products

# 产物构建：桌面应用（Windows / Linux × x64 / ARM64）+ Docker 多架构镜像（GHCR）。
# PyInstaller 不支持交叉编译：桌面产物在对应原生 runner 上构建；
# Docker 双架构各在原生 runner 构建推送，再合并 multi-arch manifest（避免 QEMU 慢速构建）。
# dev 验证通道：仅手动触发；正式发版走 release.yml（tag 触发，带校验与徽标下载页）。

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  NFPM_VERSION: "2.49.0"

jobs:
  test:
    name: gate (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

  desktop:
    name: desktop (${{ matrix.platform }} / ${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, os: windows-latest, arch: x64 }
          - { platform: windows, os: windows-11-arm, arch: arm64 }
          - { platform: linux, os: ubuntu-latest, arch: amd64 }
          - { platform: linux, os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install nfpm (linux)
        if: matrix.platform == 'linux'
        run: |
          case "$(uname -m)" in
            x86_64)  NF_ASSET="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" ;;
            aarch64) NF_ASSET="nfpm_${NFPM_VERSION}_Linux_arm64.tar.gz" ;;
            *) echo "未知架构：$(uname -m)"; exit 1 ;;
          esac
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${NF_ASSET}" | tar -xz -C /tmp
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
      - name: Build (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Arch ${{ matrix.arch }}
      - name: Build (linux)
        if: matrix.platform == 'linux'
        run: |
          pip install -e ".[gui,build]" "evalscope[perf,eval,bfcl,agentx]==1.15.0"
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"
          ./scripts/build_linux.sh "${VERSION#v}" ${{ matrix.arch }}
      - name: Upload (windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ucm-accept-windows-${{ matrix.arch }}
          path: dist/ucm-accept-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
      - name: Upload (linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ucm-accept-linux-${{ matrix.arch }}
          path: |
            dist/ucm-accept-linux-*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  docker:
    name: docker (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/potterluo/ucm-accept:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max

  docker-merge:
    name: docker manifest (multi-arch)
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Merge multi-arch manifest
        run: |
          IMAGE="ghcr.io/potterluo/ucm-accept"
          set -f  # 防止 :latest 等被 shell 展开
          ARGS=(-t "$IMAGE:dev")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            ARGS+=(-t "$IMAGE:${VERSION#v}" -t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${ARGS[@]}" \
            "$IMAGE:${{ github.sha }}-amd64" "$IMAGE:${{ github.sha }}-arm64"
      - name: Verify
        run: docker buildx imagetools inspect ghcr.io/potterluo/ucm-accept:dev
