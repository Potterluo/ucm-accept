name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，例如 1.1.0）"
        required: true
        default: "1.1.0"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release version: $VERSION"

  test:
    name: gate tests
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check ucm_accept tests scripts
      - run: pytest -q

  python-dist:
    name: wheel + sdist
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  linux-packages:
    name: linux packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: prepare
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            nfpm_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            nfpm_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils patchelf curl
          python -m pip install --upgrade pip
          pip install -e ".[gui,build]" "evalscope[perf,service]>=1.15,<2"
      - name: Install nfpm (${{ matrix.nfpm_arch }})
        run: |
          NFPM_VERSION=2.43.0
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_linux_${{ matrix.nfpm_arch }}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version
      - name: Build PyInstaller + deb/rpm
        run: bash scripts/build_linux.sh "${{ needs.prepare.outputs.version }}" "${{ matrix.arch }}"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/ucm-accept-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows-exe:
    name: windows exe
    runs-on: windows-latest
    needs: prepare
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,build]"
          pip install "evalscope[perf,service]>=1.15,<2"
      - name: Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean packaging/ucm-accept.spec
          Compress-Archive -Path "dist\ucm-accept\*" -DestinationPath "dist\ucm-accept-windows-x64.zip" -Force
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-exe
          path: dist/ucm-accept-windows-x64.zip
          if-no-files-found: error

  offline-wheelhouse:
    name: offline wheelhouse (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: prepare
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Download wheels
        run: |
          mkdir -p offline/wheelhouse
          python -m pip install --upgrade pip wheel
          pip download --only-binary=:all: -d offline/wheelhouse \
            "evalscope[perf,service]>=1.15,<2" "gradio>=6.0,<7" "PyYAML>=6"
          pip wheel --no-deps -w offline/wheelhouse .
      - name: Build tooling bundle
        run: |
          cp packaging/config.offline.yaml offline/
          cp docs/offline-build.md offline/
          cp README.md offline/
          cp scripts/prepare_assets.py offline/
          cp scripts/verify_report.py offline/
          tar -C offline -czf "ucm-accept-offline-tooling-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: offline-tooling-${{ matrix.arch }}
          path: ucm-accept-offline-tooling-*.tar.gz
          if-no-files-found: error

  docker-images:
    name: docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: prepare
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push native image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ghcr.io/ucm-system/ucm-accept:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          build-args: |
            INSTALL_AGENTX=0
          provenance: false
      - name: Push native image and save tar
        run: |
          IMAGE=ghcr.io/ucm-system/ucm-accept:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          docker push "${IMAGE}"
          mkdir -p dist
          docker save "${IMAGE}" | gzip -1 > "dist/ucm-accept-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.tar.gz"
          ls -lh dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.arch }}-image
          path: dist/*.tar.gz
          if-no-files-found: error

  docker-manifest:
    name: docker multi-arch manifest
    runs-on: ubuntu-latest
    needs: [prepare, docker-images]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          IMAGE=ghcr.io/ucm-system/ucm-accept
          docker manifest create "${IMAGE}:${VERSION}" \
            --amend "${IMAGE}:${VERSION}-amd64" \
            --amend "${IMAGE}:${VERSION}-arm64"
          docker manifest push "${IMAGE}:${VERSION}"
          docker manifest create "${IMAGE}:latest" \
            --amend "${IMAGE}:${VERSION}-amd64" \
            --amend "${IMAGE}:${VERSION}-arm64"
          docker manifest push "${IMAGE}:latest"
          docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null

  github-release:
    name: publish release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - python-dist
      - linux-packages
      - windows-exe
      - offline-wheelhouse
      - docker-images
      - docker-manifest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd release-assets
          find . -type f -printf '%P\n' | sort | xargs -r sha256sum > SHA256SUMS
          ls -lh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/**/*.whl
            release-assets/**/*.tar.gz
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.zip
            release-assets/SHA256SUMS
