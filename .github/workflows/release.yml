name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，例如 1.1.0）"
        required: true
        default: "1.1.0"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release version: $VERSION"

  test:
    name: gate tests
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check ucm_accept tests scripts
      - run: pytest -q

  python-dist:
    name: wheel + sdist
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  validate-python-dist:
    name: validate wheel / sdist
    runs-on: ubuntu-latest
    needs: [prepare, python-dist]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: twine check
        run: |
          python -m pip install --upgrade pip twine
          twine check dist/*
      - name: Clean-venv install + smoke
        run: |
          python -m venv /tmp/pkg-venv
          /tmp/pkg-venv/bin/pip install --upgrade pip
          /tmp/pkg-venv/bin/pip install dist/*.whl
          /tmp/pkg-venv/bin/pip check
          /tmp/pkg-venv/bin/ucm-accept --version
          /tmp/pkg-venv/bin/ucm-accept --mock --fast --item perf --outputs /tmp/wheel-smoke
          test -s /tmp/wheel-smoke/runs/*/report.html

  linux-packages:
    name: linux packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: prepare
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            nfpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            nfpm_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils patchelf curl
          python -m pip install --upgrade pip
          pip install -e ".[gui,build]" "evalscope[perf,eval,bfcl,agentx]==1.15.0"
      - name: Install nfpm (${{ matrix.nfpm_arch }})
        run: |
          NFPM_VERSION=2.43.0
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_linux_${{ matrix.nfpm_arch }}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version
      - name: Build PyInstaller + deb/rpm
        run: bash scripts/build_linux.sh "${{ needs.prepare.outputs.version }}" "${{ matrix.arch }}"
      - name: Validate Linux artifacts
        run: |
          "dist/ucm-accept-linux-${{ matrix.arch }}/ucm-accept" --version
          "dist/ucm-accept-linux-${{ matrix.arch }}/ucm-accept" --mock --fast --item perf --outputs "/tmp/linux-smoke-${{ matrix.arch }}"
          test -s /tmp/linux-smoke-${{ matrix.arch }}/runs/*/report.html
          dpkg-deb --info dist/ucm-accept_${{ needs.prepare.outputs.version }}_${{ matrix.arch }}.deb
          dpkg-deb --contents dist/ucm-accept_${{ needs.prepare.outputs.version }}_${{ matrix.arch }}.deb | head -20
          sudo apt-get install -y rpm
          rpm -qip dist/ucm-accept-${{ needs.prepare.outputs.version }}-1.*.rpm
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-deb
          path: dist/*.deb
          if-no-files-found: error
      - name: Upload rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-rpm
          path: dist/*.rpm
          if-no-files-found: error
      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-bundle
          path: dist/ucm-accept-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows-exe:
    name: windows exe (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: prepare
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Arch ${{ matrix.arch }}
      - name: Validate Windows executable
        shell: pwsh
        run: |
          & "dist\ucm-accept\ucm-accept.exe" --version
          & "dist\ucm-accept\ucm-accept.exe" --mock --fast --item perf --outputs "$env:RUNNER_TEMP\ucm-exe-smoke"
          if (-not (Test-Path "$env:RUNNER_TEMP\ucm-exe-smoke\runs\*\report.html")) { throw "smoke report missing" }
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-exe
          path: dist/ucm-accept-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  offline-wheelhouse:
    name: offline wheelhouse (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: prepare
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Download and normalize offline wheels
        run: |
          mkdir -p offline/wheelhouse
          python -m pip install --upgrade pip wheel
          pip download --prefer-binary -d offline/wheelhouse \
            "evalscope[perf,eval,bfcl,agentx]==1.15.0" "PyYAML>=6" "wheel" "setuptools"
          # 少数包（如 jieba）只发源码包；在构建机先转成 wheel，保证客户现场不用编译器。
          find offline/wheelhouse -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | xargs -0 -r -n1 python -m pip wheel --no-deps --wheel-dir offline/wheelhouse
          find offline/wheelhouse -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -delete
          pip wheel --no-deps -w offline/wheelhouse .
      - name: Validate offline install
        run: |
          python -m venv /tmp/offline-venv
          /tmp/offline-venv/bin/pip install --no-index --find-links offline/wheelhouse \
            "ucm-accept==${{ needs.prepare.outputs.version }}" "evalscope[perf,eval,bfcl,agentx]==1.15.0"
          /tmp/offline-venv/bin/ucm-accept --version
          /tmp/offline-venv/bin/ucm-accept --mock --fast --item perf --outputs /tmp/offline-smoke
      - name: Build tooling bundle
        run: |
          cp packaging/config.offline.yaml offline/
          cp docs/offline-build.md offline/
          cp README.md offline/
          cp scripts/prepare_assets.py offline/
          cp scripts/verify_report.py offline/
          tar -C offline -czf "ucm-accept-offline-tooling-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: offline-tooling-${{ matrix.arch }}
          path: ucm-accept-offline-tooling-*.tar.gz
          if-no-files-found: error

  asset-pack:
    name: offline asset pack
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/rust /usr/local/share/boost /usr/lib/jvm \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup 2>/dev/null || true
          df -h /
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" "evalscope[perf,eval,agentx]==1.15.0" "httpx[socks]"
          pip cache purge || true
          df -h /
      - name: Download tokenizer / dataset / AgentX caches
        run: |
          python scripts/fetch_datasets.py \
            --assets-dir ucm-assets \
            --manifest packaging/assets-manifest.json \
            --source auto \
            --evalscope-bin "$(command -v evalscope)" \
            --include-agentx --move-caches
          df -h /
      - name: Manifest + verify
        run: |
          rm -rf ucm-assets/.fetch-work
          python scripts/prepare_assets.py --assets-dir ucm-assets --output ucm-assets/manifest.json
          python scripts/prepare_assets.py --assets-dir ucm-assets --check
      - name: Pack
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          tar -czf "ucm-assets-${VERSION}.tar.gz" -C ucm-assets .
          sha256sum "ucm-assets-${VERSION}.tar.gz" > "ucm-assets-${VERSION}.tar.gz.sha256"
          ls -lh ucm-assets-*.tar.gz*
      - uses: actions/upload-artifact@v4
        with:
          name: asset-pack
          path: ucm-assets-*.tar.gz*
          if-no-files-found: error

  docker-images:
    name: docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: prepare
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image name (GHCR 需小写)
        id: img
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ucm-accept" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push native image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ${{ steps.img.outputs.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          provenance: false
      - name: Push native image and save tar
        run: |
          IMAGE="${{ steps.img.outputs.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}"
          docker push "${IMAGE}"
          docker run --rm "${IMAGE}" --version
          docker run --rm "${IMAGE}" --mock --fast --item perf --outputs /tmp/docker-smoke
          mkdir -p dist
          docker save "${IMAGE}" | gzip -1 > "dist/ucm-accept-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.tar.gz"
          ls -lh dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.arch }}-image
          path: dist/*.tar.gz
          if-no-files-found: error

  docker-manifest:
    name: docker multi-arch manifest
    runs-on: ubuntu-latest
    needs: [prepare, docker-images]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image name (GHCR 需小写)
        id: img
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ucm-accept" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          IMAGE="${{ steps.img.outputs.image }}"
          docker manifest create "${IMAGE}:${VERSION}" \
            --amend "${IMAGE}:${VERSION}-amd64" \
            --amend "${IMAGE}:${VERSION}-arm64"
          docker manifest push "${IMAGE}:${VERSION}"
          docker manifest create "${IMAGE}:latest" \
            --amend "${IMAGE}:${VERSION}-amd64" \
            --amend "${IMAGE}:${VERSION}-arm64"
          docker manifest push "${IMAGE}:latest"
          docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null

  github-release:
    name: publish release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - python-dist
      - validate-python-dist
      - linux-packages
      - windows-exe
      - offline-wheelhouse
      - asset-pack
      - docker-images
      - docker-manifest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download wheel / sdist
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-assets/python-dist
      - name: Download asset pack
        uses: actions/download-artifact@v4
        with:
          name: asset-pack
          path: release-assets/asset-pack
      - name: Download Linux amd64
        uses: actions/download-artifact@v4
        with:
          pattern: linux-amd64-*
          merge-multiple: true
          path: release-assets/linux-amd64
      - name: Download Linux arm64
        uses: actions/download-artifact@v4
        with:
          pattern: linux-arm64-*
          merge-multiple: true
          path: release-assets/linux-arm64
      - name: Download Windows exe
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*-exe
          merge-multiple: true
          path: release-assets/windows
      - name: Download offline tooling amd64
        uses: actions/download-artifact@v4
        with:
          name: offline-tooling-amd64
          path: release-assets/offline-amd64
      - name: Download offline tooling arm64
        uses: actions/download-artifact@v4
        with:
          name: offline-tooling-arm64
          path: release-assets/offline-arm64
      - name: Download docker amd64 image
        uses: actions/download-artifact@v4
        with:
          name: docker-amd64-image
          path: release-assets/docker-amd64
      - name: Download docker arm64 image
        uses: actions/download-artifact@v4
        with:
          name: docker-arm64-image
          path: release-assets/docker-arm64
      - name: Split oversized files (GitHub Release 单文件上限 2GiB)
        run: |
          cd release-assets
          found=0
          while IFS= read -r f; do
            found=1
            echo "分卷 $f（$(du -h "$f" | cut -f1)）..."
            split -b 1900M -d "$f" "${f}.part-"
            rm -f "$f"
          done < <(find . -type f -size +2000M)
          [ "$found" = 1 ] && find . -name "*.part-*" -exec ls -lh {} +
      - name: Checksums
        run: |
          cd release-assets
          find . -type f ! -name SHA256SUMS -print0 | sort -z | while IFS= read -r -d '' path; do
            printf '%s  %s\n' "$(sha256sum "$path" | cut -d' ' -f1)" "${path##*/}"
          done > /tmp/ucm-SHA256SUMS
          mv /tmp/ucm-SHA256SUMS SHA256SUMS
          head -20 SHA256SUMS
          du -sh .
      - name: Generate release notes (按 OS 徽标下载表)
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ucm-accept"
          python scripts/gen_release_notes.py \
            --tag "v${{ needs.prepare.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --image "$IMAGE" \
            --output notes.md
          cat notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/**/*.whl
            release-assets/**/*.tar.gz
            release-assets/**/*.tar.gz.part-*
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.zip
            release-assets/**/*.sha256
            release-assets/SHA256SUMS
