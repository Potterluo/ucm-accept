name: ucm-accept
arch: ${PKG_ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: UCM Delivery Engineering
description: |
  UCM 推理加速产品客户现网验收工具（GUI + CLI）。
  GUI 为本地 Gradio 浏览器界面；CLI 为容器/堡垒机菜单式交互。
vendor: UCM
homepage: https://example.com/ucm-accept
license: Proprietary

contents:
  - src: dist/ucm-accept-linux-${DIR_ARCH}/
    dst: /opt/ucm-accept
  - src: packaging/config.offline.yaml
    dst: /etc/ucm-accept/config.yaml
  - src: packaging/launch-cli.sh
    dst: /usr/bin/ucm-accept
    file_info:
      mode: 0755
  - src: packaging/launch-gui.sh
    dst: /usr/bin/ucm-accept-gui
    file_info:
      mode: 0755
  - src: packaging/ucm-accept.desktop
    dst: /usr/share/applications/ucm-accept.desktop
  - src: packaging/README.package
    dst: /opt/ucm-accept/README.package
